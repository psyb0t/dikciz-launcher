name: pipeline
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  code:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      build_command: "make ci-build"
      lint_command: "make lint"
      test_command: "make test-tooling"
  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
