name: pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  code:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      build_command: "make build ANDROID_LAB_ACCEPT_ANDROID_LICENSES=yes"
      lint_command: "make lint"
      test_command: "make test-tooling"
  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
  wait-for-default-branch:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master
    with:
      timeout_minutes: 180
  # Build the signed APK after this commit passes the default-branch pipeline.
  release:
    needs: [wait-for-default-branch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Fetch the annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
      - name: Write the release keystore
        env:
          DIKCIZ_RELEASE_KEYSTORE_BASE64: ${{ secrets.DIKCIZ_RELEASE_KEYSTORE_BASE64 }}
        run: |
          install -d -m 0700 .android-lab/release
          printf '%s' "$DIKCIZ_RELEASE_KEYSTORE_BASE64" | base64 --decode >.android-lab/release/dikciz-release.jks
          chmod 0600 .android-lab/release/dikciz-release.jks
      - name: Build the signed release APK
        env:
          ANDROID_LAB_ACCEPT_ANDROID_LICENSES: "yes"
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: make release-apk
      - name: Remove the release keystore
        if: always()
        run: rm -f .android-lab/release/dikciz-release.jks
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          assets=("dist/dikciz-launcher-v${version}.apk" "dist/dikciz-launcher-v${version}.apk.sha256")
          prerelease=()
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --notes-from-tag "${prerelease[@]}"
          fi
  clawhub:
    needs: [wait-for-default-branch]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["dikciz-launcher"]'
      plugin_names: '[]'
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
  release-badges:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
